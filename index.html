<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Name — Fashion Retoucher</title>
<meta name="description" content="Portfolio of high-end fashion retouching and colour work.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2b0f15;        /* oxblood */
  --bg2:#220b10;
  --ink:#eadfcf;       /* champagne */
  --mute:#b8a692;
  --line:rgba(234,223,207,.22);
  --serif:'Cormorant Garamond','Times New Roman',serif;
  --sans:'Jost','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(20px,5vw,64px)}

/* nav */
header{position:absolute;top:0;left:0;right:0;z-index:5;padding:28px 0}
header .wrap{display:flex;justify-content:space-between;align-items:center}
.mark{font-family:var(--serif);font-size:1.3rem;letter-spacing:.04em}
nav{display:flex;gap:clamp(16px,3vw,40px);font-size:.85rem;letter-spacing:.08em}
nav a{opacity:.8;transition:opacity .2s}
nav a:hover{opacity:1}

/* hero */
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:120px clamp(20px,5vw,64px) 56px;max-width:1400px;margin:0 auto}
.hero h1{font-family:var(--serif);font-weight:300;font-size:clamp(4rem,15vw,13rem);line-height:.9;letter-spacing:-.02em}
.hero h1 em{font-style:italic;display:block;padding-left:.9em;color:var(--mute)}
.hero .sub{margin-top:40px;max-width:44ch;color:var(--mute);font-size:1.02rem}
.hero .cta{display:inline-block;margin-top:30px;padding:14px 34px;border:1px solid var(--ink);font-size:.85rem;letter-spacing:.12em;transition:background .25s,color .25s}
.hero .cta:hover{background:var(--ink);color:var(--bg)}

/* images + placeholder */
.ph{position:relative;overflow:hidden;background:linear-gradient(160deg,#3b1820,#1c080c)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph.loaded{aspect-ratio:auto!important}
.ph.loaded img{height:auto}
.ph.missing::after{content:attr(data-name);position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;font-family:var(--serif);font-style:italic;color:var(--mute);font-size:1.1rem}

/* sections */
section{padding:clamp(72px,11vw,150px) 0}
h2{font-family:var(--serif);font-weight:300;font-size:clamp(2.2rem,5vw,4rem);line-height:1.05;margin-bottom:clamp(32px,5vw,64px)}

/* work */
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:clamp(14px,2vw,28px);
  align-items:start;
}
.item{cursor:pointer;background:none;border:0;color:inherit;text-align:left;width:100%;font:inherit;display:block}
.item .ph{transition:filter .4s}
.item:hover .ph{filter:brightness(1.08)}
.item .cap{display:flex;justify-content:space-between;gap:12px;padding:12px 2px 0;font-size:.85rem;color:var(--mute)}
.item .cap b{font-family:var(--serif);font-weight:400;font-style:italic;font-size:1.1rem;color:var(--ink)}

/* about */
.about{background:var(--bg2)}
.about .cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,100px)}
.about p{font-family:var(--serif);font-size:clamp(1.3rem,2vw,1.65rem);line-height:1.5;margin-bottom:1em}
.list{list-style:none;border-top:1px solid var(--line)}
.list li{padding:16px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}
.list li span{color:var(--mute);font-size:.9rem}

/* contact */
.contact{text-align:center}
.contact h2{font-size:clamp(2.6rem,7vw,6rem)}
.contact .mail{display:inline-block;font-family:var(--serif);font-style:italic;font-size:clamp(1.4rem,3.4vw,2.6rem);border-bottom:1px solid var(--ink);padding-bottom:4px;margin-bottom:48px}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 36px;font-size:.9rem;letter-spacing:.06em}
.links a{color:var(--mute);transition:color .2s}
.links a:hover{color:var(--ink)}
footer{padding:28px 0 40px;border-top:1px solid var(--line);font-size:.8rem;color:var(--mute)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(20,6,9,.96);z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px}
.lb.on{display:flex}
.lb img{max-height:78vh;max-width:92vw;object-fit:contain}
.lb .bar{display:flex;gap:24px;align-items:center;font-size:.85rem;color:var(--mute);flex-wrap:wrap;justify-content:center}
.lb button{background:none;border:1px solid var(--line);color:var(--ink);padding:8px 20px;font:inherit;font-size:.85rem;cursor:pointer}
.lb button:hover{border-color:var(--ink)}
.lb .x{position:absolute;top:18px;right:22px}

@media(max-width:820px){
  .about .cols{grid-template-columns:1fr}
  nav a:nth-child(n+4){display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header><div class="wrap">
  <a class="mark" href="#top" id="mark"></a>
  <nav><a href="#work">Work</a><a href="#about">About</a><a href="#contact">Contact</a></nav>
</div></header>

<main id="top">
  <div class="hero">
    <div>
      <h1 id="heroName"></h1>
      <p class="sub" id="heroSub"></p>
      <a class="cta" href="#work">View selected work</a>
    </div>
  </div>

  <section id="work"><div class="wrap">
    <h2>Selected work</h2>
    <div class="grid" id="grid"></div>
  </div></section>

  <section id="about" class="about"><div class="wrap">
    <h2>About</h2>
    <div class="cols">
      <div id="aboutText"></div>
      <ul class="list" id="services"></ul>
    </div>
  </div></section>

  <section id="contact" class="contact"><div class="wrap">
    <h2 id="contactTitle"></h2>
    <a class="mail" id="mail"></a>
    <div class="links" id="links"></div>
  </div></section>
</main>

<footer><div class="wrap"><span id="copy"></span><span id="loc"></span></div></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="x" id="close">Close</button>
  <img id="lbImg" alt="">
  <div class="bar"><span id="lbCap"></span><button id="toggle" hidden>Show original</button></div>
</div>

<script>
/* =====================================================================
   ✎ EDIT ONLY THIS BLOCK — everything on the page is built from it.
   Put your photos in the "images" folder and write their file names here.
   Photos are shown in their own proportions (landscape works best).
   ===================================================================== */
const SITE = {
  name: "Abdollah",                         // shown big on the first screen
  nameSecondLine: "Mohajeri",                 // second (italic) line; "" to hide
  role: "UI/UX, Design, Fashion retoucher & colour artist",
  intro: "Refined retouching and colour work for fashion, beauty and editorial — skin that stays real, fabric that stays true.",

  about: [
     "I specialize in UI/UX design, creating intuitive, visually engaging, and user-centered experiences for websites and mobile applications. Using Figma, I develop interface designs, wireframes, interactive prototypes, and modern digital layouts that combine aesthetics with usability.",

  "My expertise also includes graphic design, mockup creation, custom icon design, advertising banners, social media stories, promotional visuals, photo manipulation, high-end fashion and beauty retouching, skin and fabric refinement, hair retouching, and professional colour grading. With experience in Photoshop, Figma, Premiere Pro, Lightroom, and Capture One, I deliver polished visual solutions for digital platforms, branding, advertising campaigns, and print media."
  ],
  services: [                                // left = name, right = short detail
    ["High-end skin retouching", "Frequency separation, dodge & burn"],
  ["Colour grading", "Editorial & campaign looks"],
  ["Fabric & garment cleanup", "Wrinkles, drape, shape"],
  ["Hair & beauty finishing", "Flyaways, makeup refinement"],
  ["UI/UX Design", "User interface, user experience, web & app design"],
  ["Figma", "UI design, wireframes, interactive prototypes"],
  ["Mockup Design", "Professional product and branding mockups"],
  ["Icon Design", "Custom icons and icon sets"],
  ["Banner Design", "Web, advertising and promotional banners"],
  ["Story Design", "Instagram stories and social media visuals"],
  ["Graphic Design", "Creative layouts, visual communication and branding"],
  ["Photo Editing", "Image enhancement, retouching and photo manipulation"],
  ["Advertising Design", "Promotional graphics and campaign visuals"],
  ["Software", "Photoshop, Figma, Premiere Pro, Lightroom, Capture One"]
  ],

  /* Work: "after" = your edited image (required). "before" = original (optional;
     delete the line if you don't want the 'Show original' button). */
  work: [
    { title: "Editorial no. 1", note: "Retouching & colour", after: "images/work-01.jpg", ratio: "3/2" },
    { title: "Editorial no. 2", note: "Retouching & colour", after: "images/work-04.jpg", ratio: "3/2" },
    { title: "Editorial no. 3", note: "Banner", after: "images/work-02.jpg", ratio: "16/9" },
    { title: "Editorial no. 4", note: "Banner", after: "images/work-05.jpg", ratio: "16/9" },
    { title: "Editorial no. 5", note: "Icons", after: "images/work-03.jpg", ratio: "3/2" },
    { title: "Editorial no. 6", note: "After Before", after: "images/work-06.jpg", ratio: "3/2" },
    { title: "Editorial no. 7", note: "UI/UX", after: "images/work-07.jpg", ratio: "16/9" },
    { title: "Editorial no. 8", note: "UI/UX", after: "images/work-08.jpg", ratio: "16/9" },
    { title: "Editorial no. 9", note: "UI/UX", after: "images/work-09.jpg", ratio: "16/9" },
    { title: "Editorial no. 10", note: "UI/UX", after: "images/work-10.jpg", ratio: "16/9" },
    { title: "Editorial no. 11", note: "UI/UX", after: "images/work-11.jpg", ratio: "16/9" },
    { title: "Editorial no. 12", note: "BUI/UX", after: "images/work-12.jpg", ratio: "16/9" },
    { title: "Editorial no. 13", note: "UI/UX", after: "images/work-13.jpg", ratio: "16/9" },
    { title: "Editorial no. 14", note: "UI/UX", after: "images/work-14.jpg", ratio: "16/9" }

  ],

  contactTitle: "Let’s work together",
  email: "Abdollahmoajeri.net@gmail.com",
  links: [                                   // add, remove or reorder freely
    //{ label: "Instagram", url: "https://instagram.com/yourhandle" },
    //{ label: "Telegram",  url: "https://t.me/yourhandle" },
    { label: "WhatsApp",  url: "https://wa.me/+37493091022" },
    { label: "LinkedIn",  url: "https://www.linkedin.com/in/abdollah-mohajeri/" },
    //{ label: "Download CV", url: "cv.pdf" }
  ],
  location: "City, Country",
  year: "2026"
};
/* ===================== end of editable block ===================== */

const $ = id => document.getElementById(id);

function photo(src, name, ratio){
  const d = document.createElement('div');
  d.className = 'ph';
  if (ratio) d.style.aspectRatio = ratio;
  d.dataset.name = name;
  const i = new Image();
  i.alt = name; i.loading = 'lazy';
  i.onerror = () => { i.remove(); d.classList.add('missing'); };
  i.onload = () => d.classList.add('loaded');
  i.src = src;
  d.appendChild(i);
  return d;
}

document.title = SITE.name + " — " + SITE.role;
$('mark').textContent = SITE.name;
$('heroName').innerHTML = SITE.name + (SITE.nameSecondLine ? "<em>" + SITE.nameSecondLine + "</em>" : "");
$('heroSub').textContent = SITE.role + ". " + SITE.intro;

SITE.work.forEach((w, n) => {
  const b = document.createElement('button');
  b.className = 'item';
  b.setAttribute('aria-label', 'Open ' + w.title);
  b.appendChild(photo(w.after, w.title, w.ratio));
  const c = document.createElement('div');
  c.className = 'cap';
  c.innerHTML = '<b></b><span></span>';
  c.firstChild.textContent = w.title;
  c.lastChild.textContent = w.note || '';
  b.appendChild(c);
  b.onclick = () => openLb(n);
  $('grid').appendChild(b);
});

SITE.about.forEach(t => { const p = document.createElement('p'); p.textContent = t; $('aboutText').appendChild(p); });
SITE.services.forEach(s => {
  const li = document.createElement('li');
  li.innerHTML = '<div></div><span></span>';
  li.firstChild.textContent = s[0];
  li.lastChild.textContent = s[1];
  $('services').appendChild(li);
});

$('contactTitle').textContent = SITE.contactTitle;
$('mail').textContent = SITE.email;
$('mail').href = 'mailto:' + SITE.email;
SITE.links.forEach(l => {
  const a = document.createElement('a');
  a.textContent = l.label; a.href = l.url;
  if (/^https?:/.test(l.url)) { a.target = '_blank'; a.rel = 'noopener'; }
  $('links').appendChild(a);
});
$('copy').textContent = '© ' + SITE.year + ' ' + SITE.name;
$('loc').textContent = SITE.location;

/* lightbox */
let cur = 0, showBefore = false;
function paint(){
  const w = SITE.work[cur];
  $('lbImg').src = showBefore && w.before ? w.before : w.after;
  $('lbImg').alt = w.title;
  $('lbCap').textContent = w.title + (w.note ? ' — ' + w.note : '');
  $('toggle').hidden = !w.before;
  $('toggle').textContent = showBefore ? 'Show edited' : 'Show original';
}
function openLb(n){ cur = n; showBefore = false; paint(); $('lb').classList.add('on'); $('close').focus(); }
function closeLb(){ $('lb').classList.remove('on'); }
$('close').onclick = closeLb;
$('lb').onclick = e => { if (e.target === $('lb')) closeLb(); };
$('toggle').onclick = () => { showBefore = !showBefore; paint(); };
document.addEventListener('keydown', e => {
  if (!$('lb').classList.contains('on')) return;
  const N = SITE.work.length;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowRight') { cur = (cur + 1) % N; showBefore = false; paint(); }
  if (e.key === 'ArrowLeft')  { cur = (cur - 1 + N) % N; showBefore = false; paint(); }
});
</script>
</body>
</html>
